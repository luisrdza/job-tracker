openapi: 3.1.0
info:
  title: Jobs
  version: 1.0.0
servers:
  - url: https://localhost
security: []
paths:
  /api/v1/health:
    get:
      summary: Health check
      responses:
        "200":
          description: Health check page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
        "503":
          description: Health check failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
  /api/v1/jobs:
    get:
      summary: Paginated list
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by job status (JobStatus PHP Enum)
          schema:
            type: string
            enum: [DRAFT, APPLIED, INTERVIEWING, REJECTED, OFFER]
        - name: limit
          in: query
          required: false
          description: Max limit records to be returned.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          description: URL-safe Base64 token representing the created_at and ID of the last processed record.
          schema:
            type: string
      responses:
        "200":
          description: List of jobs paginated
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    description: The page results.
                    items:
                      $ref: '#/components/schemas/JobPosting'
                  next_cursor:
                    type: [string, "null"]
                    description: Token to fetch the next page. It will be null if there are no more results.
                    example: "eyJjcmVhdGVkX2F0IjoiMjAyNi0xMS0xMCAxMDo..."
        "422":
          description: Job validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        "503":
          description: Service Unavailable. The database is down or unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
    post:
      summary: Create job
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobPosting'
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Universal Unique Identifier
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPosting'
        "401":
          description: Unauthorized (invalid token or missing)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        "403":
          description: Forbidden (do not have permission)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        "409":
          description: Conflict - The request with this Idempotency-Key was already processed or it's in process.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        "422":
          description: Job validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        "503":
          description: Service Unavailable. The database is down or unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

components:
  securitySchemes:
    BearerAuth:
      description: Bearer token
      type: http
      scheme: bearer
  schemas:
    HealthCheck:
      type: object
      properties:
        status:
          type: string
        timestamp:
          type: string
        version:
          type: string
        database:
          type: string
    JobPosting:
      type: object
      required:
        - title
        - company
        - status
        - salary_max
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
        company:
          type: string
        status:
          type: string
          enum: [DRAFT, APPLIED, INTERVIEWING, REJECTED, OFFER]
        salary_max:
          type: [integer, "null"]
        idempotency_key:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    ValidationError:
      type: object
      properties:
        code:
          type: integer
          example: 422
        message:
          type: string
