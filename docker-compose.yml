name: app

services:
  app:
    build: ./backend
    volumes:
      - ./backend:/app
    working_dir: /app
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/app:ro
    depends_on:
      - app